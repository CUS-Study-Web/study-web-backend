spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:studyweb}
    username: ${POSTGRES_USER:studyweb}
    password: ${POSTGRES_PASSWORD:studyweb}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-seed
    baseline-on-migrate: true
    out-of-order: true
    connect-retries: 30
    connect-retries-interval: 5

spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_SERVER:studyweb-postgres}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  flyway:
    enabled: false
logging:
  file:
    name: logs/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB       
      max-history: 7
spring:
  application:
    name: cus
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    connect-retries: 30
    connect-retries-interval: 5

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}
  otp:
    length: ${OTP_LENGTH}
    expiration-seconds: ${OTP_EXPIRATION_SECONDS}
    max-attempts: ${OTP_MAX_ATTEMPTS}
    cooldown-seconds: ${OTP_COOLDOWN_SECONDS}

s3:
  endpoint: ${S3_URL:}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  bucket: ${S3_BUCKET}
  region: ${S3_REGION:ap-southeast-1}
  max-size-document-upload: ${MAX_SIZE_DOCUMENT_UPLOAD:10485760}
  max-size-avatar-upload: ${MAX_SIZE_AVATAR_UPLOAD:5242880}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
thread:
  core-thread-pool-size: ${CORE_THREAD_POOL_SIZE:2}
  max-thread-pool-size: ${MAX_THREAD_POOL_SIZE:10}
  thread-queue-capacity: ${THREAD_QUEUE_CAPACITY:100}

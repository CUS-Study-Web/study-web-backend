spring:
  application:
    name: cus
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}
  otp:
    length: ${OTP_LENGTH}
    expiration-seconds: ${OTP_EXPIRATION_SECONDS}
    max-attempts: ${OTP_MAX_ATTEMPTS}
    cooldown-seconds: ${OTP_COOLDOWN_SECONDS}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
thread:
  core-thread-pool-size: ${CORE_THREAD_POOL_SIZE:2}
  max-thread-pool-size: ${MAX_THREAD_POOL_SIZE:10}
  thread-queue-capacity: ${THREAD_QUEUE_CAPACITY:100}

logging:
  loki:
    url: ${LOKI_URL}

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUS - Mã OTP đặt lại mật khẩu</title>
</head>

<body style="margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center" style="padding:40px 16px;">
                <div
                    style="max-width:420px;width:100%;background:#ffffff;border-radius:12px;padding:32px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                    <h1 style="margin:0 0 8px;font-size:22px;color:#18181b;">CUS</h1>

                    <p style="margin:0 0 24px;font-size:14px;color:#71717a;">
                        Sử dụng mã OTP dưới đây để đặt lại mật khẩu của bạn.
                        Mã sẽ hết hạn sau <strong>{{expiryMinutes}}</strong> phút.
                    </p>

                    <div
                        style="font-size:36px;font-weight:700;letter-spacing:8px;color:#2563eb;background:#eff6ff;border-radius:8px;padding:16px;">
                        {{otp}}
                    </div>

                    <p style="margin:24px 0 0;font-size:12px;color:#a1a1aa;">
                        Nếu bạn không yêu cầu đặt lại mật khẩu, vui lòng bỏ qua email này.
                        Không chia sẻ mã OTP này với bất kỳ ai để bảo vệ tài khoản của bạn.
                    </p>
                </div>
            </td>
        </tr>
    </table>
</body>

</html>

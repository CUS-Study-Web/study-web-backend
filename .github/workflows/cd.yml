name: Study Web Backend CD flow

on:
  workflow_run:
    workflows:
      - "Study Web Backend CI flow"
    types:
      - completed
    branches:
      - main

concurrency:
  group: be-deploy
  cancel-in-progress: false
 
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/backend
  GITOPS_REPO: CUS-Study-Web/study-web-gitops
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-and-push-ghcr:
    name: Build and Push Docker Image to GitHub Container Registry
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Grant execute permission for mvnw
        run: |
          sudo apt-get install -y dos2unix
          dos2unix mvnw
          chmod +x mvnw

      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format image name to lowercase
        run: |
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Build and push for main
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest


  deploy:
    name: Deploy Backend
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: build-and-push-ghcr
    runs-on: self-hosted

    steps:
      - name: Checkout GitOps Manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          path: gitops-manifests
          ref: main

      - name: Setup Rootless Podman Environment
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"

          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

      - name: Verify Podman User
        run: |
          echo "===== USER ====="
          whoami
          id

          echo "===== ROOTLESS ====="
          podman info --format 'rootless={{.Host.Security.Rootless}}'

          echo "===== PODMAN VERSION ====="
          podman --version

          echo "===== RUNTIME ====="
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"

          echo "===== LINGER ====="
          loginctl show-user "$(whoami)" -p Linger

      - name: Deploy Backend
        working-directory: gitops-manifests
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          make be-prod

      - name: Verify Backend
        working-directory: gitops-manifests
        run: |
          sleep 5s
          echo "===== CONTAINERS ====="
          podman ps -a

          echo "===== BACKEND LOGS ====="
          podman inspect studyweb-backend \
            --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}}'

          podman logs --tail 100 studyweb-backend

          echo "===== PORT ====="
          podman port studyweb-backend
name: Study Web Backend CD flow

on:
  workflow_run:
    workflows: ["Study Web Backend CI flow"]
    types:
      - completed
    branches:
      - main
      - staging

concurrency:
  group: be-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/backend
  GITOPS_REPO: CUS-Study-Web/study-web-gitops
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build-and-push-ghcr:
      name: Build and Push Docker Image to GitHub Container Registry
      if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main') }}
      needs: build-and-test
      runs-on: ubuntu-latest

      permissions:
        contents: read
        packages: write

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Set up JDK 25
          uses: actions/setup-java@v4
          with:
            java-version: "25"
            distribution: "temurin"
            cache: maven

        - name: Grant execute permission for mvnw
          run: |
            sudo apt-get install -y dos2unix
            dos2unix mvnw
            chmod +x mvnw

        - name: Build JAR with Maven
          run: ./mvnw clean package -DskipTests

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Format image name to lowercase
          run: |
            echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

        - name: Build and push for staging
          if: ${{ github.ref == 'refs/heads/staging' }}
          uses: docker/build-push-action@v5
          with:
            context: .
            file: Dockerfile
            push: true
            tags: |
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:staging

        - name: Build and push for main
          if: ${{ github.ref == 'refs/heads/main' }}
          uses: docker/build-push-action@v5
          with:
            context: .
            file: Dockerfile
            push: true
            tags: |
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout GitOps Manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          path: gitops-manifests
          ref: main
      - name: Verify Podman user
        run: |
          whoami
          id
          podman info --format 'rootless={{.Host.Security.Rootless}}'
      - name: Create backend.env from secret
        env:
          BACKEND_ENV_CONTENT: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          printf "%s" "$BACKEND_ENV_CONTENT" > gitops-manifests/backend.env
      - name: Check infra
        run: |
          make infra
      - name: Deploy Backend
        working-directory: gitops-manifests
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            make be-prod
          elif [ "${{ github.event.workflow_run.head_branch }}" = "staging" ]; then
            make be-staging
          else
            echo "Unsupported branch: ${{ github.event.workflow_run.head_branch }}"
            exit 1
          fi
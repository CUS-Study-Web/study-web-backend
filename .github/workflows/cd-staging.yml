name: Study Web Backend CD Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: be-deploy-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/backend
  GITOPS_REPO: CUS-Study-Web/study-web-gitops
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-and-push-ghcr:
    name: Build and Push Docker Image to GitHub Container Registry
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Grant execute permission for mvnw
        run: |
          sudo apt-get install -y dos2unix
          dos2unix mvnw
          chmod +x mvnw

      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format image name to lowercase
        run: |
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Build and push for staging
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:staging

  deploy:
    name: Deploy Backend Staging
    needs: build-and-push-ghcr
    runs-on: self-hosted

    steps:
      - name: Checkout GitOps Manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          path: gitops-manifests
          ref: main

      - name: Setup Rootless Podman Environment
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"

          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

      - name: Create permanent configs
        working-directory: gitops-manifests
        env:
          BACKEND_ENV_CONTENT: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          mkdir -p ~/.config/systemd/user/git-ops/nginx

          printf "%s" "$BACKEND_ENV_CONTENT" > ~/.config/systemd/user/git-ops/backend.env
          chmod 600 ~/.config/systemd/user/git-ops/backend.env

          cp nginx/default.conf ~/.config/systemd/user/git-ops/nginx/default.conf

          cp docker.*.compose.yml ~/.config/systemd/user/git-ops/
      - name: Check infra
        run: |
          make infra
      - name: Deploy Backend
        working-directory: gitops-manifests
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          make be-staging

      - name: Verify Backend
        working-directory: gitops-manifests
        run: |
          sleep 5
          echo "===== CONTAINERS ====="
          podman ps -a

          echo "===== BACKEND LOGS ====="
          podman inspect studyweb-backend-staging \
            --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}}'

          podman logs --tail 100 studyweb-backend-staging

          echo "===== PORT ====="
          podman port studyweb-backend-staging